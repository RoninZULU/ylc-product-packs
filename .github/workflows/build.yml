# Cada mes, los paquetes de productos de nuevo: la exportación del día de
# Open Food Facts y la última versión de USDA Branded Foods. Se publican como
# la última versión y se quedan sólo las tres más recientes.
name: Paquetes de productos

on:
  schedule:
    - cron: '0 4 3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Open Food Facts
        run: curl -fsSL --retry 3 -o products.csv.gz https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz

      - name: USDA Branded Foods (la última)
        run: |
          path=$(curl -fsSL https://fdc.nal.usda.gov/download-datasets/ \
            | grep -oE '/fdc-datasets/FoodData_Central_branded_food_csv_[0-9]{4}-[0-9]{2}-[0-9]{2}\.zip' \
            | sort -u | tail -1)
          test -n "$path"
          echo "USDA_RELEASE=$(echo "$path" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 -o branded.zip "https://fdc.nal.usda.gov$path"

      - name: Generar
        run: python build_packs.py --off products.csv.gz --usda branded.zip --usda-release "$USDA_RELEASE" --out dist

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(date -u +%Y-%m-%d)
          gh release create "$tag" dist/* --latest --title "Paquetes $tag" \
            --notes "Open Food Facts del $tag (ODbL 1.0) y USDA FoodData Central Branded Foods del $USDA_RELEASE (CC0)."
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
